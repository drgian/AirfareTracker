# The Xcode project is generated from this file rather than committed, so it never
# fills up with merge conflicts. Regenerate after adding files:  xcodegen generate
name: FlightFare
options:
  bundleIdPrefix: io.flightfare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3LPUBZN4QQ
    SWIFT_VERSION: "5.0"

targets:
  FlightFare:
    type: application
    platform: iOS
    sources:
      - path: FlightFare
        excludes:
          - "Info.plist"           # referenced by INFOPLIST_FILE; don't also copy it in
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.flightfare.app
        INFOPLIST_FILE: FlightFare/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlightFare/FlightFare.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only for now
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
